# CİCO Android test sürümü (debug APK) — GitHub'ın sunucularında derlenir.
# Her push'ta (oyun dosyaları değiştiyse) ya da elle (Actions → Android APK → Run workflow) çalışır.
# Sonuç her zaman aynı adreste:
#   https://github.com/grafikerkafasi/cico/releases/download/android-latest/CICO-debug.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/scenes/**'
      - 'assets/audio/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/build-www.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund

      - name: Uygulama paketi (www/)
        run: node tools/build-www.js

      - name: Android projesi
        run: |
          npx cap add android
          npx cap sync android

      - name: Derleme (debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CICO-debug.apk

      - name: Sabit indirme adresine yayınla (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest CICO-debug.apk \
            --title "CİCO Android (test sürümü)" \
            --notes "Otomatik test sürümü (debug). Commit: ${{ github.sha }}. Telefona indirip kur; 'bilinmeyen kaynaklardan yükleme' izni gerekir." \
            --prerelease
